<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph / Twitter share card source (1200x630). Pages use the PNG
  export (og-cover.png) because Facebook, Instagram and LinkedIn don't
  render SVG previews. Re-export after editing:
    node scripts/render-og.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F1EA"/>
  <text x="80" y="118" font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="26" fill="#1A1814" letter-spacing="3">FRONT PAGE <tspan fill="#9E7B3D">COMMERCE</tspan></text>
  <text font-family="'Arial Black', 'Segoe UI', sans-serif" font-size="72" fill="#1A1814" letter-spacing="-1">
    <tspan x="80" y="270">SHOPIFY STORES THAT</tspan>
    <tspan x="80" y="356">CONVERT <tspan fill="#9E7B3D">1.5–2X</tspan> HIGHER.</tspan>
  </text>
  <text x="80" y="428" font-family="'Segoe UI', Arial, sans-serif" font-size="32" fill="#4A463E">Custom ecommerce storefronts for consumer brands. Live in 14 days.</text>
  <rect x="80" y="506" width="72" height="3" fill="#9E7B3D"/>
  <text x="80" y="558" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="22" fill="#6E5424" letter-spacing="3">MADEFRONTPAGE.COM</text>
  <text x="1120" y="558" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="22" fill="#6E5424" letter-spacing="3">SEE YOUR HOMEPAGE FIRST</text>
</svg>
